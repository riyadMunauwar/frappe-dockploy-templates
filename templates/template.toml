# @@HEADER@@

[variables]
main_domain = "${domain}"
db_root_password = "${password:32}"
admin_password = "${password:32}"

[config]
[[config.domains]]
serviceName = "frontend"
port = 8080
host = "${main_domain}"

[config.env]
SITE_NAME = "${main_domain}"
ADMIN_PASSWORD = "${admin_password}"
DB_ROOT_PASSWORD = "${db_root_password}"
IMAGE_TAG = "@@IMAGE_TAG@@"
